name: One-off People Image Repair

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clear only accidentally matched image paths
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm dlx tsx@4.20.3 -e '
            import { createClient } from "@supabase/supabase-js";
            const db = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL!, process.env.SUPABASE_SERVICE_ROLE_KEY!);
            const ids = ["3355", "3356", "3357", "3358"];
            for (const id of ids) {
              const prefix = `global/people_image/${id}/%`;
              const { data, error } = await db.from("people")
                .update({ image_path: null, updated_at: new Date().toISOString() })
                .eq("id", id)
                .like("image_path", prefix)
                .select("id");
              if (error) throw error;
              console.log(JSON.stringify({ id, cleared: data?.length ?? 0 }));
            }
          '
